description = "WorksGood Pi profile — Pi owns providers, authentication, model discovery, endpoints, availability, usage, and cost"

# WG owns orchestration policy only. Every route is an exact
# `pi:<provider>:<model>` identity; Pi validates and executes it. Change these
# IDs with `wg profile pi` after selecting them through Pi's own model catalog.
# No WG endpoint, API key, or model-registry entry is required.

[agent]
model = "pi:openrouter:z-ai/glm-5.2"

[dispatcher]
model = "pi:openrouter:z-ai/glm-5.2"
max_agents = 8

# Predictive build admission is an advanced opt-in. Recovery must not be
# blocked by a historical cold-build projection for an already-warm target.
[dispatcher.resource_management]
disk_sentinel_enabled = false

[tiers]
fast = "pi:openrouter:deepseek/deepseek-chat"
fast_reasoning = "low"
standard = "pi:openrouter:z-ai/glm-5.2"
standard_reasoning = "high"
premium = "pi:openrouter:z-ai/glm-5.2"
premium_reasoning = "xhigh"

[models.default]
model = "pi:openrouter:z-ai/glm-5.2"
reasoning = "high"

[models.task_agent]
model = "pi:openrouter:z-ai/glm-5.2"
reasoning = "high"

# Weak/recoverable judgment roles remain explicit and Pi-routed.
[models.evaluator]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.assigner]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.flip_inference]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.flip_comparison]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.reviewer]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"
