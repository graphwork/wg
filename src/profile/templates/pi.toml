description = "WorksGood Pi profile — Pi owns providers, authentication, model discovery, endpoints, availability, usage, and cost"

# WG owns orchestration policy only. Strong inherits the project default. The
# starter's established weak DeepSeek split remains explicit; use
# `wg profile pi --reset-weak` when the selected project should inherit strong.
# Every route is an exact `pi:<provider>:<model>` identity.
# No WG endpoint, API key, or model-registry entry is required.

[dispatcher]
max_agents = 8
# Automatic task archival is disabled by default (retention 0). Deliberately
# opt in per project after reviewing the exact evidence-bearing batch.

# Safe-by-default physical-delta admission for shared-baseline build layers.
# Set false only as a visible emergency override.
[dispatcher.resource_management]
disk_sentinel_enabled = true

[tiers]
fast = "pi:openrouter:deepseek/deepseek-chat"
fast_reasoning = "low"
standard_reasoning = "high"
premium_reasoning = "xhigh"

[models.default]
model = "pi:openrouter:z-ai/glm-5.2"
reasoning = "high"

[models.task_agent]
reasoning = "high"

# The starter's intentional weak/recoverable judgment pins are preserved.
[models.evaluator]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.assigner]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.flip_inference]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.flip_comparison]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"

[models.reviewer]
model = "pi:openrouter:deepseek/deepseek-chat"
reasoning = "low"
