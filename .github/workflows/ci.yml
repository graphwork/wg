name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (default features, including worksgood)
        run: |
          cargo clippy
          cargo clippy --bin worksgood

      - name: Release/install contract static gate
        run: tests/install/release_contract.sh

      - name: Installer dry-run and isolated-prefix smoke
        run: tests/install/installer_smoke.sh

  build:
    name: Build & Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build (all default-feature binaries)
        run: cargo build --locked --bins

      - name: cargo test (unit tests + worksgood target)
        run: |
          cargo test --lib
          cargo test --bin worksgood

      - name: cargo test (doc tests)
        run: cargo test --doc

  lifecycle-formal:
    name: Lean lifecycle proofs & Rust conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          lake-package-directory: formal

      - name: Reject Lean proof escapes
        run: |
          if grep -RInE --include='*.lean' \
            '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*(unsafe|axiom)[[:space:]]' \
            formal; then
            echo '::error::Lean proof placeholder, unsafe declaration, or unscoped axiom found'
            exit 1
          fi

      - name: lake build (pinned lifecycle proofs + executable oracle)
        working-directory: formal
        run: |
          lake build
          lake build simple-land-oracle

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust/Lean lifecycle reducer conformance
        run: >-
          cargo test --locked
          --test lifecycle_protocol_conformance
          --test simple_land_conformance
          --test simple_land_lean_oracle
          --test completion_manifest_resolver
          --test completion_review_valve

  integration:
    name: Integration Tests (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo install into isolated root (needed by integration tests)
        run: |
          root="${RUNNER_TEMP}/worksgood-install-root"
          cargo install --path . --locked --root "${root}"
          test -x "${root}/bin/worksgood"
          test -x "${root}/bin/wg"
          test -x "${root}/bin/nex"
          "${root}/bin/worksgood" --help >/dev/null
          "${root}/bin/wg" --help >/dev/null
          "${root}/bin/nex" --help >/dev/null
          echo "${root}/bin" >> "${GITHUB_PATH}"

      - name: cargo test --test integration_service
        run: cargo test --test integration_service -- --test-threads=1
        timeout-minutes: 10

  installer-windows:
    name: Windows PowerShell installer contract
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Isolated install/dry-run/upgrade/uninstall smoke
        shell: pwsh
        run: ./tests/install/installer_smoke.ps1

  worksgood-pi:
    name: pi-worksgood build, selftest & embed staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build plugin + selftests
        run: |
          npm --prefix worksgood-pi ci
          npm --prefix worksgood-pi run build
          npm --prefix worksgood-pi run selftest
          node worksgood-pi/host/wg-pi-host.mjs --selftest --force-compat-mismatch
          npm --prefix worksgood-pi test

      # Anti-drift gate: re-embed from the just-built dist and fail if the
      # committed worksgood-pi/embedded/ (or generated version.ts) differs. A source
      # edit under worksgood-pi/src/** without a re-embed is
      # caught here, keeping "committed dist == fresh build" an invariant.
      - name: Embed staleness gate
        run: |
          scripts/embed-worksgood-pi.sh --no-install
          git diff --exit-code worksgood-pi/embedded worksgood-pi/src/version.ts \
            || { echo "::error::worksgood-pi/embedded is stale — run \`make embed-worksgood-pi\` and commit the result"; exit 1; }

  nightly:
    name: Build & Test (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-

      # `+nightly` overrides the channel pinned in rust-toolchain.toml so this
      # job actually exercises nightly (the toml would otherwise force stable).
      - name: cargo build
        run: cargo +nightly build

      - name: cargo test
        run: cargo +nightly test --lib
